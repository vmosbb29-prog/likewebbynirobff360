services:
  - type: web
    name: like-by-nirob
    runtime: node
    region: singapore
    plan: free
    buildCommand: >
      npm install -g pnpm &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @workspace/db run generate &&
      pnpm --filter @workspace/slv run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: like-by-nirob-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: "10000"

databases:
  - name: like-by-nirob-db
    databaseName: likenirob
    user: nirobadmin
    region: singapore
    plan: free
